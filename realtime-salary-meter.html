<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Salary Meter</title>
<style>
  :root{
    --bg: #ffffff;
    --ink: #1d1d1f;
    --ink-dim: #86868b;
    --ink-faint: #c7c7cc;
    --line: #e5e5ea;
    --green: #34c759;
    --red: #ff3b30;
    --gray-btn: #e5e5ea;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --mono-num: -apple-system, "SF Pro Rounded", BlinkMacSystemFont, system-ui, sans-serif;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    height: 100%;
  }

  body{
    min-height: 100vh;
    min-height: 100dvh;
    display:flex;
    justify-content:center;
  }

  .app{
    width:100%;
    max-width: 480px;
    min-height: 100vh;
    min-height: 100dvh;
    display:flex;
    flex-direction:column;
    padding: env(safe-area-inset-top, 18px) 24px calc(env(safe-area-inset-bottom, 18px) + 18px);
  }

  /* ---------- Hero (centered, flat, no card) ---------- */
  .hero{
    flex: 1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap: 0;
    padding: 0 4px;
  }

  .amount{
    font-family: var(--mono-num);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: clamp(48px, 14vw, 84px);
    line-height: 1;
    letter-spacing: -0.01em;
    word-break: break-word;
    color: var(--ink);
  }
  .amount .dec{
    color: var(--ink-dim);
    font-size: 0.5em;
  }

  .increment{
    margin-top: 10px;
    font-family: var(--mono-num);
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    font-weight: 600;
    color: var(--green);
    opacity: 0.55;
    height: 20px;
  }
  .increment.idle{ opacity: 0; }

  .sentence{
    margin-top: 18px;
    font-size: 15px;
    color: var(--ink);
    opacity: 0.9;
  }

  /* ---------- Wage row (small, unobtrusive) ---------- */
  .wage-row{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap: 0;
    padding: 4px 0 18px;
    font-size: 13px;
    color: var(--ink-dim);
  }
  .wage-row .yen{
    color: var(--ink-dim);
    transition: transform .15s ease;
  }
  .wage-row .yen.shift{
    transform: translateX(-1ch);
  }
  .wage-row input{
    text-align: left;
    background: transparent;
    border: none;
    border-bottom: 1px solid transparent;
    outline: none;
    color: var(--ink-dim);
    font-family: var(--mono-num);
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    padding: 0;
    margin: 0;
    -moz-appearance: textfield;
    appearance: textfield;
    transition: border-color .15s ease, color .15s ease;
  }
  .wage-row input::-webkit-outer-spin-button,
  .wage-row input::-webkit-inner-spin-button{
    -webkit-appearance: none;
    margin: 0;
  }
  .wage-row input:focus{
    border-bottom-color: var(--ink-dim);
    color: var(--ink);
  }
  .wage-row .per-hour{ color: var(--ink-dim); }

  /* ---------- Controls (bottom, calculator-style) ---------- */
  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 28px;
    padding-top: 4px;
  }
  .ctrl-btn{
    width: 76px;
    height: 76px;
    border-radius: 50%;
    border: none;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: opacity .1s ease;
  }
  .ctrl-btn:active{ opacity: 0.6; }
  .ctrl-btn:focus-visible{ outline: 2px solid var(--ink-dim); outline-offset: 3px; }

  .ctrl-reset{
    background: var(--gray-btn);
    color: var(--ink);
  }
  .ctrl-start{
    background: var(--green);
    color: #ffffff;
  }
  .ctrl-start.is-running{
    background: var(--red);
  }

  /* ---------- Milestone toast (plain, no glow) ---------- */
  .toast{
    position: fixed;
    top: env(safe-area-inset-top, 14px);
    left: 50%;
    transform: translate(-50%, -8px);
    background: var(--ink);
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease, transform .3s ease;
    z-index: 50;
    white-space: nowrap;
  }
  .toast.show{
    opacity: 1;
    transform: translate(-50%, 4px);
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="app">

  <div class="hero">
    <div class="amount" id="amountDisplay">¥<span class="int">0</span><span class="dec">.00</span></div>
    <div class="increment idle" id="incrementDisplay">+¥0.00</div>
    <div class="sentence" id="sentenceDisplay">働き始めたところです</div>
  </div>

  <div class="wage-row">
    <span class="yen" id="yenSymbol">¥</span><input id="wageInput" type="number" min="1" step="1" inputmode="decimal" value="1225"><span class="per-hour">&nbsp;/hour</span>
  </div>

  <div class="controls">
    <button id="resetBtn" class="ctrl-btn ctrl-reset">RESET</button>
    <button id="startBtn" class="ctrl-btn ctrl-start">START</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ===================== State ===================== */
  var STORAGE_KEY = "realtimeSalaryMeter_v1";
  var MILESTONE_THRESHOLDS = [100, 500, 1000];

  var state = {
    wage: 1225,
    isRunning: false,
    accumulatedMs: 0,     // total milliseconds counted while running (before current run segment)
    startEpoch: null,     // Date.now() when current run segment started; null if not running
    milestones: { 100: false, 500: false, 1000: false }
  };

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      var saved = JSON.parse(raw);
      if(typeof saved.wage === "number" && saved.wage > 0) state.wage = saved.wage;
      if(typeof saved.accumulatedMs === "number") state.accumulatedMs = saved.accumulatedMs;
      if(typeof saved.isRunning === "boolean") state.isRunning = saved.isRunning;
      if(typeof saved.startEpoch === "number" || saved.startEpoch === null) state.startEpoch = saved.startEpoch;
      if(saved.milestones) state.milestones = saved.milestones;
    }catch(e){ /* ignore corrupt storage */ }
  }

  var saveTimer = null;
  function saveState(){
    if(saveTimer) return;
    saveTimer = setTimeout(function(){
      saveTimer = null;
      try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }catch(e){ /* storage unavailable */ }
    }, 200);
  }

  /* ===================== Core calculation ===================== */
  // earnedMoney = elapsedMs / 3600000 * hourlyWage  (exact, no accumulation drift)
  function getElapsedMs(){
    var extra = state.isRunning && state.startEpoch ? (Date.now() - state.startEpoch) : 0;
    return state.accumulatedMs + Math.max(0, extra);
  }

  function getEarned(elapsedMs){
    return (elapsedMs / 3600000) * state.wage;
  }

  /* ===================== Formatting ===================== */
  function formatMoneyParts(amount){
    var fixed = amount.toFixed(2);
    var parts = fixed.split(".");
    var intPart = parseInt(parts[0], 10).toLocaleString("ja-JP");
    return { intPart: intPart, decPart: parts[1] };
  }

  function naturalSentence(ms){
    var totalMin = Math.floor(ms / 60000);
    var h = Math.floor(totalMin / 60);
    var m = totalMin % 60;
    if(h === 0 && m === 0){
      return "働き始めたところです";
    }
    if(h === 0){
      return m + "分働いています";
    }
    return h + "時間" + m + "分働いています";
  }

  /* ===================== DOM refs ===================== */
  var el = {
    amountInt: document.querySelector("#amountDisplay .int"),
    amountDec: document.querySelector("#amountDisplay .dec"),
    increment: document.getElementById("incrementDisplay"),
    sentence: document.getElementById("sentenceDisplay"),
    startBtn: document.getElementById("startBtn"),
    resetBtn: document.getElementById("resetBtn"),
    wageInput: document.getElementById("wageInput"),
    yenSymbol: document.getElementById("yenSymbol"),
    toast: document.getElementById("toast")
  };

  /* ===================== Rendering ===================== */
  function renderStatus(){
    el.startBtn.textContent = state.isRunning ? "STOP" : "START";
    el.startBtn.classList.toggle("is-running", state.isRunning);
    el.increment.classList.toggle("idle", !state.isRunning);
  }

  // Standard layout assumes a 4-digit wage (e.g. ¥1225). For 5+ digit
  // wages, shift the yen symbol one character to the left instead of
  // letting the row grow only to the right.
  function updateWageLayout(){
    var digits = String(el.wageInput.value || "").replace(/[^0-9]/g, "").length || 1;
    el.wageInput.style.width = digits + "ch";
    el.yenSymbol.classList.toggle("shift", digits >= 5);
  }

  function checkMilestones(earned){
    var newlyReached = null;
    MILESTONE_THRESHOLDS.forEach(function(t){
      if(!state.milestones[t] && earned >= t){
        state.milestones[t] = true;
        newlyReached = t;
      }
    });
    if(newlyReached !== null){
      showToast("¥" + newlyReached.toLocaleString("ja-JP") + " REACHED");
      saveState();
    }
  }

  var toastTimer = null;
  function showToast(text){
    el.toast.textContent = text;
    el.toast.classList.add("show");
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){
      el.toast.classList.remove("show");
    }, 1800);
  }

  function renderMain(elapsedMs, earned){
    var parts = formatMoneyParts(earned);
    el.amountInt.textContent = parts.intPart;
    el.amountDec.textContent = "." + parts.decPart;
    el.sentence.textContent = naturalSentence(elapsedMs);
  }

  /* ===================== Main loop ===================== */
  var lastTickSecond = -1;

  function tick(){
    var elapsedMs = getElapsedMs();
    var earned = getEarned(elapsedMs);

    renderMain(elapsedMs, earned);
    checkMilestones(earned);

    // per-second increment refresh + persistence, throttled to once a second
    var currentSecond = Math.floor(elapsedMs / 1000);
    if(state.isRunning && currentSecond !== lastTickSecond){
      lastTickSecond = currentSecond;
      var perSecond = state.wage / 3600;
      el.increment.textContent = "+¥" + perSecond.toFixed(2);
      saveState();
    }

    requestAnimationFrame(tick);
  }

  /* ===================== Controls ===================== */
  function handleStartStop(){
    if(state.isRunning){
      state.accumulatedMs = getElapsedMs();
      state.isRunning = false;
      state.startEpoch = null;
    } else {
      state.isRunning = true;
      state.startEpoch = Date.now();
      lastTickSecond = Math.floor(getElapsedMs() / 1000) - 1; // let the first tick fire immediately
    }
    renderStatus();
    saveState();
  }

  function handleReset(){
    state.isRunning = false;
    state.startEpoch = null;
    state.accumulatedMs = 0;
    state.milestones = { 100: false, 500: false, 1000: false };
    lastTickSecond = -1;
    renderStatus();
    renderMain(0, 0);
    el.increment.textContent = "+¥0.00";
    saveState();
  }

  function handleWageChange(){
    var v = parseFloat(el.wageInput.value);
    if(isNaN(v) || v <= 0){
      el.wageInput.value = state.wage;
      updateWageLayout();
      return;
    }
    state.wage = v;
    updateWageLayout();
    saveState();
  }

  el.startBtn.addEventListener("click", handleStartStop);
  el.resetBtn.addEventListener("click", handleReset);
  el.wageInput.addEventListener("input", updateWageLayout);
  el.wageInput.addEventListener("change", handleWageChange);
  el.wageInput.addEventListener("blur", handleWageChange);

  /* ===================== Init ===================== */
  loadState();
  el.wageInput.value = state.wage;
  updateWageLayout();
  renderStatus();
  var initElapsed = getElapsedMs();
  renderMain(initElapsed, getEarned(initElapsed));
  el.increment.textContent = "+¥" + (state.wage / 3600).toFixed(2);
  lastTickSecond = Math.floor(initElapsed / 1000);
  requestAnimationFrame(tick);

})();
</script>
</body>
</html>
